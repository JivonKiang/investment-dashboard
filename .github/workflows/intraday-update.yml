name: Intraday Update

on:
  schedule:
    - cron: '*/30 1-6 * * 1-5'  # UTC 01:00-06:30 每30分钟 = 北京时间 09:00-14:30
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --break-system-packages

      - name: Quick market update
        run: |
          python src/main.py --mode quick-update

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
          include_files: |
            index.html
            data/**
