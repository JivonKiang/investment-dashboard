name: Daily Analysis

on:
  schedule:
    - cron: '0 1 * * 1-5'  # UTC 01:00 = 北京时间 09:00
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --break-system-packages

      - name: Run full analysis
        run: |
          python src/main.py --mode full-analysis

      - name: Update game state
        run: |
          python src/main.py --mode update-game

      - name: Generate dashboard
        run: |
          python src/main.py --mode generate-dashboard

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
          include_files: |
            index.html
            data/**
